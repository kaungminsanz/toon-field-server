<script>
const cv=document.getElementById('c');
if(matchMedia('(hover:none),(pointer:coarse)').matches){const h=document.getElementById('hint');h.textContent=h.dataset.touch}
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();
S.background=new THREE.Color(0xbfe6ff);

const cam=new THREE.PerspectiveCamera(55,1,.1,1000);

addEventListener('resize',resize);resize();

// lights
S.add(new THREE.HemisphereLight(0xffffff,0xbfe8c8,.45));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(5,10,6);S.add(sun);

// toon ramp

const toon=c=>new THREE.MeshToonMaterial({color:c,gradientMap:ramp});
const inkMat=new THREE.MeshBasicMaterial({color:0x2a1f3d,side:THREE.BackSide});

  const g=new THREE.Group();
  const m=new THREE.Mesh(geo,toon(color));
  const o=new THREE.Mesh(geo,inkMat);o.scale.setScalar(1.07);
  g.add(m,o);if(pos)g.position.set(...pos);if(scl)g.scale.set(...scl);return g;
}

// empty ground
const gc=document.createElement('canvas');gc.width=gc.height=256;const x2=gc.getContext('2d');
x2.fillStyle='#9ddf94';x2.fillRect(0,0,256,256);
for(let i=0;i<1400;i++){x2.strokeStyle='hsl('+(95+Math.random()*30)+','+(45+Math.random()*20)+'%,'+(42+Math.random()*22)+'%)';x2.lineWidth=1+Math.random()*1.5;const x=Math.random()*256,y=Math.random()*256;x2.beginPath();x2.moveTo(x,y);x2.lineTo(x+(Math.random()-.5)*6,y-4-Math.random()*8);x2.stroke()}
const gtex=new THREE.CanvasTexture(gc);gtex.wrapS=gtex.wrapT=THREE.RepeatWrapping;gtex.repeat.set(240,240);gtex.anisotropy=4;

ground.rotation.x=-Math.PI/2;S.add(ground);
const ring=new THREE.Mesh(new THREE.RingGeometry(600,601,64),new THREE.MeshBasicMaterial({color:0xffffff}));
ring.rotation.x=-Math.PI/2;ring.position.y=.01;S.add(ring);

// floating sparkles
const N=160,pp=new Float32Array(N*3);
for(let i=0;i<N;i++){pp[i*3]=(Math.random()-.5)*200;pp[i*3+1]=Math.random()*8+.5;pp[i*3+2]=(Math.random()-.5)*200}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffd1e8,size:.25}));pts.frustumCulled=false;S.add(pts);

// grass (follows the hero in steps so it looks endless)
const GP=4,GC=1.2,GN=80,GW=GP*GC;
const gGeo=new THREE.ConeGeometry(.06,.6,3);gGeo.translate(0,.3,0);
const gT={value:0};
function windy(m){m.onBeforeCompile=s=>{s.uniforms.uTime=gT;s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform float uTime;').replace('#include <begin_vertex>','#include <begin_vertex>\nvec4 wp=modelMatrix*instanceMatrix*vec4(0.,0.,0.,1.);\nfloat sw=sin(uTime*2.2+wp.x*.35+wp.z*.3)+.5*sin(uTime*3.7+wp.x*.8);\ntransformed.x+=sw*position.y*.22;transformed.z+=sw*position.y*.12;')};return m}
const grass=new THREE.InstancedMesh(gGeo,windy(toon(0xffffff)),GN*GN*2);
const dm=new THREE.Object3D(),gcol=new THREE.Color(),jit=[];
for(let k=0;k<GP*GP*2;k++)jit.push([Math.random(),Math.random(),Math.random(),Math.random(),Math.random()]);
let gn=0;
for(let i=0;i<GN;i++)for(let j=0;j<GN;j++)for(let b=0;b<2;b++){
  const r=jit[((i%GP)*GP+(j%GP))*2+b];
  dm.position.set((i-GN/2+r[0])*GC,0,(j-GN/2+r[1])*GC);
  dm.rotation.set((r[2]-.5)*.5,r[3]*6.28,(r[4]-.5)*.5);
  dm.scale.set(1,.6+r[2]*.9,1);dm.updateMatrix();
  grass.setMatrixAt(gn,dm.matrix);
  gcol.setHSL(.27+r[3]*.06,.55,.45+r[4]*.15);grass.setColorAt(gn,gcol);gn++;
}
// flowers (placed by world position, so they stay put)
const fGeo=new THREE.SphereGeometry(.22,8,6);fGeo.translate(0,1,0);
const sGeo=new THREE.CylinderGeometry(.03,.03,1,4);sGeo.translate(0,.5,0);
const flw=new THREE.InstancedMesh(fGeo,windy(toon(0xffffff)),GN*GN),stm=new THREE.InstancedMesh(sGeo,windy(toon(0x5fbf5a)),GN*GN);
const pal=[0xffffff,0xffd23f,0xff8fb8,0xb9a0ff];
const hs=(a,b,k)=>{const x=Math.sin(a*127.1+b*311.7+k*74.7)*43758.5453;return x-Math.floor(x)};
function placeFlowers(oi,oj){let fn=0;
  for(let i=0;i<GN;i++)for(let j=0;j<GN;j++){
    const wi=oi+i-GN/2,wj=oj+j-GN/2;
    if(hs(wi,wj,4)>.14)continue;
    const h=.35+hs(wi,wj,2)*.3;
    dm.position.set((i-GN/2+hs(wi,wj,1))*GC,0,(j-GN/2+hs(wi,wj,0))*GC);dm.rotation.set(0,0,0);dm.scale.set(h,h,h);dm.updateMatrix();
    flw.setMatrixAt(fn,dm.matrix);stm.setMatrixAt(fn,dm.matrix);
    gcol.setHex(pal[Math.floor(hs(wi,wj,3)*4)%4]);flw.setColorAt(fn,gcol);fn++;}
  flw.count=stm.count=fn;
  flw.instanceMatrix.needsUpdate=stm.instanceMatrix.needsUpdate=true;flw.instanceColor.needsUpdate=true}

const gGroup=new THREE.Group();gGroup.add(grass,flw,stm);gGroup.children.forEach(c=>c.frustumCulled=false);S.add(gGroup);

// LOVE sign at the center of the map
const sign=new THREE.Group();sign.rotation.y=Math.PI;S.add(sign);
sign.add(inked(new THREE.CylinderGeometry(13,13.6,.4,48),0xffd6e7,[0,.2,0]));
const SH=6,SW=4,ST=1,SD=1.2,sc=[0xff4d6d,0xff8fb8,0xff4d6d,0xff8fb8];
function bx(g,x,y,w,h,c){g.add(inked(new THREE.BoxGeometry(w,h,SD),c,[x+w/2,y+h/2,0]))}
const Lg=new THREE.Group(),Og=new THREE.Group(),Vg=new THREE.Group(),Eg=new THREE.Group();
bx(Lg,0,0,ST,SH,sc[0]);bx(Lg,0,0,SW,ST,sc[0]);
Og.add(inked(new THREE.TorusGeometry(1.45,.55,14,40),sc[1],[SW/2,SH/2,0],[1,1.5,1]));
const va=Math.atan((SW/2)/SH),vl=Math.hypot(SW/2,SH)+.3;
[[1,SW/4],[-1,SW*.75]].forEach(a=>{const s=inked(new THREE.BoxGeometry(ST,vl,SD),sc[2],[a[1],SH/2,0]);s.rotation.z=a[0]*va;Vg.add(s)});
bx(Eg,0,0,ST,SH,sc[3]);bx(Eg,0,0,SW,ST,sc[3]);bx(Eg,0,SH/2-ST/2,SW*.85,ST,sc[3]);bx(Eg,0,SH-ST,SW,ST,sc[3]);
[Lg,Og,Vg,Eg].forEach((g,i)=>{g.position.set(-9.8+i*(SW+1.2),.4,0);sign.add(g)});
const hp=[];for(let a=0;a<=64;a++){const t=a/64*Math.PI*2;hp.push(new THREE.Vector2(16*Math.pow(Math.sin(t),3)*.28,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*.28))}
const hGeo=new THREE.ExtrudeGeometry(new THREE.Shape(hp),{depth:1.4,bevelEnabled:true,bevelSize:.15,bevelThickness:.15,bevelSegments:2});hGeo.translate(0,0,-.7);
const loveHeart=inked(hGeo,0xff4d6d,[0,12.2,0]);sign.add(loveHeart);

// Large tree beside the right side of the sign
const tree=new THREE.Group();tree.position.set(18,0,1);S.add(tree);
tree.add(inked(new THREE.CylinderGeometry(.8,1.25,12,14),0x8a5a36,[0,6,0]));
function treeBranch(from,to,r){
  const start=new THREE.Vector3(...from),end=new THREE.Vector3(...to);
  const direction=end.clone().sub(start),mid=start.clone().add(end).multiplyScalar(.5);
  const branch=inked(new THREE.CylinderGeometry(r*.65,r,direction.length(),10),0x8a5a36,[mid.x,mid.y,mid.z]);
  branch.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());
  tree.add(branch);
}
treeBranch([0,5.5,0],[-3.4,11.5,0],.48);
treeBranch([0,7,0],[3.6,12.5,.2],.5);
treeBranch([0,8,0],[0,14,-.3],.55);
[
  [0,15,0,5.1,5.8,4.7,0x55ad55],
  [-3.1,13.7,.1,3.8,4.1,4,0x69bf5e],
  [3.1,14.2,.2,3.9,4.4,4.1,0x4e9f4d],
  [-1.4,18.3,-.2,3.7,3.8,3.7,0x75c968],
  [2,17.8,.4,3.5,3.8,3.6,0x5caf52],
].forEach(([x,y,z,sx,sy,sz,color])=>{

// elephant
const ele=new THREE.Group();ele.position.set(-6,0,-31);ele.rotation.y=.5;S.add(ele);
const eBody=new THREE.Group();ele.add(eBody);

eBody.add(inked(new THREE.SphereGeometry(1,32,24),eg,[0,2.2,0],[1.1,1.05,1.55]));
eBody.add(inked(new THREE.SphereGeometry(.75,28,20),eg,[0,2.55,1.75],[1,1,.95]));
eBody.add(inked(new THREE.SphereGeometry(.9,24,12),0xff4d6d,[0,3.17,.2],[1,.2,1]));
// big floppy ears with pink insides: they flare outward and flap (angles set in updEle)
const mkEar=s=>{const g=new THREE.Group();g.position.set(s*.95,2.8,1.55);
  g.add(inked(new THREE.SphereGeometry(.8,24,18),eg,[0,0,0],[.1,1,.95]));
  g.add(inked(new THREE.SphereGeometry(.62,20,14),0xf2a9b8,[s*.04,-.02,0],[.1,.85,.8]));
  eBody.add(g);return g};
const earL=mkEar(-1),earR=mkEar(1);
[-1,1].forEach(s=>{
  const e=new THREE.Mesh(new THREE.SphereGeometry(.08,10,8),new THREE.MeshBasicMaterial({color:0x2a1f3d}));e.position.set(s*.32,2.65,2.41);eBody.add(e);
  const hl=new THREE.Mesh(new THREE.SphereGeometry(.03,6,6),new THREE.MeshBasicMaterial({color:0xffffff}));hl.position.set(s*.32+.02,2.69,2.47);eBody.add(hl);
  const tg=new THREE.ConeGeometry(.09,.8,10);tg.translate(0,.4,0);const tk=inked(tg,0xfff8e7,[s*.38,2.15,2.25]);tk.rotation.x=1.25;tk.rotation.z=-s*.2;eBody.add(tk)});
const trunk=[];{let par=new THREE.Group();par.position.set(0,2.3,2.4);eBody.add(par);
  [.28,.23,.19,.15,.12].forEach((r,i,a)=>{const sg=new THREE.Group();if(i>0)sg.position.y=-.42;sg.add(inked(new THREE.CylinderGeometry(r,a[i+1]||.1,.46,12),eg,[0,-.23,0]));par.add(sg);trunk.push(sg);par=sg})}

function tfLabel(name) {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(35,25,65,.78)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(4, 4, 248, 56, 18); else ctx.rect(4, 4, 248, 56);
  ctx.fill();
  ctx.font = 'bold 26px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(String(name || 'Player').slice(0, 18), 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(2.56, .64, 1);   // compensates for the 1.25 avatar scale
  sp.position.y = 2.56;
  return sp;
}

function tfBuildRemoteMap(avatar) {
  const sourceNodes = [];
  const cloneNodes = [];
  hero.traverse(o => sourceNodes.push(o));
  avatar.traverse(o => cloneNodes.push(o));

  const map = new Map();
  sourceNodes.forEach((o, i) => {
    if (cloneNodes[i]) map.set(o, cloneNodes[i]);
  });

  // A cloned Three.js object shares its materials by default.
  // Give this remote player independent materials so their outfit
  // colors never change the local player's outfit.
  avatar.traverse(o => {
    if (!o.material) return;
    o.material = Array.isArray(o.material)
      ? o.material.map(m => m.clone())
      : o.material.clone();
  });

  return map;
}

function tfMappedList(list, map) {
  return list.map(o => map.get(o)).filter(Boolean);
}

function tfMappedParts(source, map) {
  const result = {};
  for (const key in source) {
    result[key] = {};
    for (const item in source[key]) {
      result[key][item] = tfMappedList(source[key][item], map);
    }
  }
  return result;
}

function tfApplyRemoteLook(r, rawLook) {
  if (!r || !r.nodeMap || !rawLook) return;
  if (typeof rawLook === 'string' && rawLook.length > 2000) return;

  let remoteLook;
  try {
    remoteLook = typeof rawLook === 'string' ? JSON.parse(rawLook) : rawLook;
  } catch (e) {
    console.warn('Invalid remote outfit data:', e);
    return;
  }
  if (!remoteLook || typeof remoteLook !== 'object') return;
  r.ride = (remoteLook.ride === 'bike' || remoteLook.ride === 'ele') ? remoteLook.ride : '';

  const m = r.nodeMap;
  const remoteTint = (list, color) => {
    if (!Number.isFinite(color)) return;
    list.forEach(o => {
      (function walk(n) {
        if (n.userData.noTint && !list.includes(n)) return;
        if (n.material && n.material.isMeshToonMaterial) n.material.color.setHex(color);
        n.children.forEach(walk);
      })(o);
    });
  };
  const remoteSetVis = (groups, key) => {
    Object.values(groups).flat().forEach(o => { o.visible = false; });
    (groups[key] || []).forEach(o => { o.visible = true; });
  };

  remoteTint(tfMappedList(topTint, m), remoteLook.topC);
  remoteTint(tfMappedList(botTint, m), remoteLook.bottomC);
  remoteTint(tfMappedList(hairTint, m), remoteLook.hairC);
  remoteTint(tfMappedList(headTint, m), remoteLook.headC);
  remoteTint(tfMappedList(skinObjs, m), remoteLook.skinC);

  const remoteParts = tfMappedParts(parts, m);
  if (remoteLook.top) remoteSetVis(remoteParts.top, remoteLook.top);
  if (remoteLook.bottom) remoteSetVis(remoteParts.bottom, remoteLook.bottom);
  if (remoteLook.head) remoteSetVis(remoteParts.head, remoteLook.head);
  if (remoteLook.thanaka) remoteSetVis(remoteParts.thanaka, remoteLook.thanaka);
  if (remoteLook.extras) remoteSetVis(remoteParts.extras, remoteLook.extras);

  for (const key in hairG) {
    const remoteHair = m.get(hairG[key]);
    if (remoteHair) remoteHair.visible = key === remoteLook.hair;
  }
  tfMappedList(hatHide, m).forEach(o => { o.visible = remoteLook.head === 'none'; });
  tfMappedList(brows, m).forEach(o => { o.visible = remoteLook.gender === 'boy'; });
  tfMappedList(blushes, m).forEach(o => {
    o.visible = remoteLook.gender !== 'boy' && remoteLook.thanaka === 'none';
  });

  // The cloned local name tag is hidden; the multiplayer name label is separate.
  const clonedLocalTag = m.get(tag);
  if (clonedLocalTag) clonedLocalTag.visible = false;

  r.lookRaw = typeof rawLook === 'string' ? rawLook : JSON.stringify(rawLook);
}

function tfAddRemote(id, p) {
  if (tfRemote.has(id)) return;

  const avatar = hero.clone(true);
  const nodeMap = tfBuildRemoteMap(avatar);
  avatar.position.set(Number(p.x) || 0, Number(p.y) || 0, Number(p.z) || 0);
  avatar.visible = true;
  avatar.scale.setScalar(1.25); // same size as the local hero
  avatar.rotation.y = Number(p.yaw) || 0;
  S.add(avatar);

  const label = tfLabel(p.name || 'Guest');
  avatar.add(label);

  const remote = {
    avatar,
    label,
    nodeMap,
    name: String(p.name || 'Guest'),
    lookRaw: '',
    speed: 0,
    phase: 0,
    y: Number(p.y) || 0,
    tx: Number(p.x) || 0, ty: Number(p.y) || 0, tz: Number(p.z) || 0, tyaw: Number(p.yaw) || 0,
    lastX: Number(p.x) || 0,
    lastZ: Number(p.z) || 0,
    lastMotionAt: Date.now(),
    rig: {
      body: nodeMap.get(body),
      hipL: nodeMap.get(hipL), hipR: nodeMap.get(hipR),
      kneeL: nodeMap.get(kneeL), kneeR: nodeMap.get(kneeR),
      armL: nodeMap.get(armL), armR: nodeMap.get(armR),
      elbL: nodeMap.get(elbL), elbR: nodeMap.get(elbR),
      head: nodeMap.get(head),
      ponyP: nodeMap.get(ponyP)
    }
  };
  tfRemote.set(id, remote);
  tfApplyRemoteLook(remote, p.look);
}

function tfUpdateRemote(id, p) {
  let r = tfRemote.get(id);
  if (!r) {
    tfAddRemote(id, p);
    r = tfRemote.get(id);
  }
  if (!r) return;

  const nextX = Number(p.x) || 0;
  const nextY = Number(p.y) || 0;
  const nextZ = Number(p.z) || 0;
  const now = Date.now();
  const elapsed = Math.max(.05, (now - (r.lastMotionAt || now)) / 1000);
  const distance = Math.hypot(nextX - r.lastX, nextZ - r.lastZ);
  r.lastX = nextX;
  r.lastY = nextY;
  r.lastZ = nextZ;
  r.lastMotionAt = now;
  r.y = nextY;
  // don't snap: store the target, tfAnimateRemote glides toward it every frame
  r.tx = nextX; r.ty = nextY; r.tz = nextZ; r.tyaw = Number(p.yaw) || 0;

  const newName = String(p.name || 'Guest');
  if (r.name !== newName) {
    if (r.label) {
      r.avatar.remove(r.label);
      if (r.label.material && r.label.material.map) r.label.material.map.dispose();
      if (r.label.material) r.label.material.dispose();
    }
    r.label = tfLabel(newName);
    r.avatar.add(r.label);
    r.name = newName;
  }

  if (typeof p.look === 'string' && p.look !== r.lookRaw) {
    tfApplyRemoteLook(r, p.look);
  }
  if (r.label) r.label.material.rotation = 0;
}

// ---- remote bike / elephant riding ----
// Vehicles are cloned lazily the first time a remote player rides one.
// Geometry/materials are shared with the originals, so never dispose them.
function tfCloneMap(src, clone) {
  const a = [], b = [];
  src.traverse(o => a.push(o));
  clone.traverse(o => b.push(o));
  const m = new Map();
  a.forEach((o, i) => { if (b[i]) m.set(o, b[i]); });
  return m;
}

function tfEnsureRemoteBike(r) {
  if (r.bike) return r.bike;
  const g = bike.clone(true);
  const m = tfCloneMap(bike, g);
  g.visible = false;
  S.add(g);
  r.bike = { g, wheels: wheels.map(w => m.get(w)).filter(Boolean), pd: 0 };
  return r.bike;
}

function tfEnsureRemoteEle(r) {
  if (r.ele) return r.ele;
  const g = ele.clone(true);
  const m = tfCloneMap(ele, g);
  g.visible = false;
  S.add(g);
  r.ele = {
    g, eph: 0,
    body: m.get(eBody), earL: m.get(earL), earR: m.get(earR), tail: m.get(tail),
    trunk: trunk.map(n => m.get(n)), legs: eLegs.map(n => m.get(n))
  };
  return r.ele;
}

function tfRideRemote(r, dt, time) {
  const kind = r.ride || '';
  if (r.bike) r.bike.g.visible = kind === 'bike';
  if (r.ele) r.ele.g.visible = kind === 'ele';
  if (!kind) return;
  const q = r.rig, av = r.avatar, sp = r.speed;

  if (kind === 'bike') {
    const b = tfEnsureRemoteBike(r);
    b.g.visible = true;
    b.g.position.set(av.position.x, av.position.y, av.position.z);
    b.g.rotation.y = av.rotation.y - Math.PI / 2;
    b.pd += dt * sp * 1.3;
    const c = Math.sin(b.pd);
    b.wheels.forEach(w => { w.rotation.z -= sp * dt / .45; });
    q.hipL.rotation.x = -.95 + c * .45; q.hipR.rotation.x = -.95 - c * .45;
    q.kneeL.rotation.x = 1.05 - c * .5; q.kneeR.rotation.x = 1.05 + c * .5;
    q.armL.rotation.x = q.armR.rotation.x = -1.15;
    q.elbL.rotation.x = q.elbR.rotation.x = -.2;
    q.body.position.y = .1; q.body.position.z = -.22; q.body.rotation.x = .2;
  } else {
    const e = tfEnsureRemoteEle(r);
    e.g.visible = true;
    e.g.position.set(av.position.x, 0, av.position.z);
    e.g.rotation.y = av.rotation.y;
    e.eph += dt * sp * 1.1;
    const amp = Math.min(1, sp / 3), s = Math.sin(e.eph);
    e.legs.forEach((l, i) => { if (l) l.rotation.x = ((i === 0 || i === 3) ? s : -s) * .36 * amp; });
    if (e.body) e.body.position.y = Math.abs(Math.cos(e.eph)) * .07 * amp + Math.sin(time * 1.6) * .015;
    const f = Math.sin(time * 3.2) * .5 + .5;
    if (e.earL) e.earL.rotation.y = .7 + .22 * f;
    if (e.earR) e.earR.rotation.y = -(.7 + .22 * f);
    const lift = Math.pow(Math.max(0, Math.sin(time * .7)), 6);
    e.trunk.forEach((g, i) => { if (g) g.rotation.x = -(.1 + .04 * i) + Math.sin(time * 1.8 + i * .7) * .1 - lift * .28 + s * .05 * amp; });
    if (e.tail) { e.tail.rotation.z = Math.sin(time * 2.4) * .35; e.tail.rotation.x = .1 + s * .1 * amp; }
    q.hipL.rotation.x = q.hipR.rotation.x = -1.05;
    q.hipL.rotation.z = -.55; q.hipR.rotation.z = .55;
    q.kneeL.rotation.x = q.kneeR.rotation.x = 1.1;
    q.armL.rotation.x = q.armR.rotation.x = -.9;
    q.elbL.rotation.x = q.elbR.rotation.x = -.3;
    q.body.position.y = Math.abs(Math.sin(e.eph)) * .04; q.body.position.z = .16; q.body.rotation.x = .05;
  }
}

function tfAnimateRemote(r, dt, time) {
  if (!r || !r.rig) return;
  // Fade movement speed smoothly when the other player stops moving.
  {
    const av = r.avatar, ox = av.position.x, oz = av.position.z;
    const k = 1 - Math.exp(-dt * 14);
    const dx0 = r.tx - ox, dz0 = r.tz - oz;
    if (Math.hypot(dx0, dz0) > 30) { av.position.x = r.tx; av.position.z = r.tz; }
    else { av.position.x += dx0 * k; av.position.z += dz0 * k; }
    av.position.y += (r.ty - av.position.y) * k;
    let dyaw = r.tyaw - av.rotation.y; dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
    av.rotation.y += dyaw * k;
    // speed from real smoothed motion, so legs/wheels/elephant steps match what you see
    const inst = Math.hypot(av.position.x - ox, av.position.z - oz) / Math.max(dt, 1e-3);
    r.speed += (Math.min(12, inst) - r.speed) * (1 - Math.exp(-dt * 8));
  }
  const q = r.rig;
  const air = r.y > 0.12;
  const amp = Math.min(1, r.speed / 4);
  r.phase += dt * (r.speed > 7 ? 17 : r.speed > 4.5 ? 13 : 9);
  const run = r.speed > 7;
  const sw = Math.sin(r.phase) * amp * (run ? 1.25 : 1);

  q.body.position.y = air ? 0 : Math.abs(Math.cos(r.phase)) * .05 * amp + (1 - amp) * Math.sin(time * 2) * .006;
  q.body.rotation.x += ((air ? .05 : amp * .1) - q.body.rotation.x) * Math.min(1, 10 * dt);
  q.hipL.rotation.x = air ? -.5 : sw * .8;
  q.hipR.rotation.x = air ? .4 : -sw * .8;
  q.kneeL.rotation.x = air ? .9 : Math.max(0, -Math.cos(r.phase)) * (run ? 1.25 : .9) * amp;
  q.kneeR.rotation.x = air ? .5 : Math.max(0, Math.cos(r.phase)) * (run ? 1.25 : .9) * amp;
  q.armL.rotation.x = air ? -2.4 : -sw * (run ? .95 : .7);
  q.armR.rotation.x = air ? -2.4 : sw * (run ? .95 : .7);
  q.armL.rotation.z = -.1;
  q.armR.rotation.z = .1;
  q.elbL.rotation.x = q.elbR.rotation.x = -.3 - .3 * amp;
  q.hipL.rotation.z = q.hipR.rotation.z = 0;
  q.body.position.z = 0;
  q.head.rotation.z = Math.sin(time * 2) * .03;
  q.head.rotation.x = -q.body.rotation.x * .6;
  if (q.ponyP) q.ponyP.rotation.x = .12 + amp * .35 + Math.sin(r.phase * 2) * .08 * amp + Math.sin(time * 2) * .03;
  tfRideRemote(r, dt, time);
}

function tfRemoveRemote(id) {
  const r = tfRemote.get(id);
  if (r) {
    S.remove(r.avatar);
    if (r.bike) S.remove(r.bike.g);
    if (r.ele) S.remove(r.ele.g);
    if (r.label && r.label.material && r.label.material.map) {
      r.label.material.map.dispose();
    }
    r.avatar.traverse(o => {
      // Geometry is shared with the source hero clone; do not dispose it.
      // Materials were cloned per remote avatar, so they can be disposed.
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
    tfRemote.delete(id);
  }
}
